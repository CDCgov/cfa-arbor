name: Lint Commit Messages

on:
  push:
    branches: [main]

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install gitlint
        run: pip install gitlint

      - name: Lint commits
        run: gitlint --commits ${{ github.event.before }}..${{ github.sha }}
