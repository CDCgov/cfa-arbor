[project]
name = "arbor"
version = "0.1.0"
description = "ARB data management"
readme = "README.md"
authors = [{ name = "Scott Olesen", email = "ulp7@cdc.gov" }]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
arbor = "arbor:main"

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9.1.1"]
