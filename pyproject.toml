[project]
name = "arbor"
version = "1.0.0"
description = "ARB data management"
readme = "README.md"
authors = [{ name = "Scott Olesen", email = "ulp7@cdc.gov" }]
requires-python = ">=3.12"
dependencies = [
    "fsspec>=2026.7.0",
]

[project.scripts]
arbor = "arbor:main"

[project.optional-dependencies]
azure = [
    "adlfs>=2026.8.0",
]

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9.1.1"]
